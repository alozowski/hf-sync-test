name: Sync to Hugging Face Space

on:
  push:
    branches: [main]

concurrency:
  group: hf-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Sync GitHub to Hugging Face Hub
        uses: huggingface/hub-sync@f7d86a92949d3659b1b6ca36556215e22afcbd1d
        with:
          github_repo_id: alozowski/hf-sync-test
          huggingface_repo_id: alozowski/hf-sync-test
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
